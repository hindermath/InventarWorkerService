name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - "docfx.json"
      - "index.md"
      - "toc.yml"
      - "README.md"
      - "docs/**"
      - "**/*.cs"
      - "**/*.csproj"
      - ".github/workflows/docs-pages.yml"
      - ".github/scripts/postprocess-docfx-site.sh"
      - ".github/fixtures/docfx-theme-toggle.*"
  pull_request:
    paths:
      - "docfx.json"
      - "index.md"
      - "toc.yml"
      - "README.md"
      - "docs/**"
      - "**/*.cs"
      - "**/*.csproj"
      - ".github/workflows/docs-pages.yml"
      - ".github/scripts/postprocess-docfx-site.sh"
      - ".github/fixtures/docfx-theme-toggle.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore solution dependencies
        run: dotnet restore InventarWorkerService.sln

      - name: Install DocFX and accessibility tooling
        run: |
          dotnet tool update --global docfx || dotnet tool install --global docfx
          sudo apt-get update
          sudo apt-get install -y lynx
          npm install --no-save @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Build DocFX site
        run: docfx docfx.json

      - name: Test DocFX theme postprocessor fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          mkdir -p "$fixture_dir/public"
          cp .github/fixtures/docfx-theme-toggle.html "$fixture_dir/index.html"
          cp .github/fixtures/docfx-theme-toggle.js "$fixture_dir/public/docfx.min.js"
          bash .github/scripts/postprocess-docfx-site.sh "$fixture_dir"
          test "$(grep -c '<button type="button"' "$fixture_dir/index.html")" -eq 2
          test "$(grep -c '<button type="button"' "$fixture_dir/public/docfx.min.js")" -eq 2
          grep -F 'aria-expanded="false"' "$fixture_dir/index.html"
          grep -F "aria-expanded='true'" "$fixture_dir/index.html"
          grep -F '<a class="nav-link dropdown-toggle" href="#" role="button"' "$fixture_dir/index.html"
          before="$(sha256sum "$fixture_dir/index.html" "$fixture_dir/public/docfx.min.js")"
          bash .github/scripts/postprocess-docfx-site.sh "$fixture_dir"
          test "$before" = "$(sha256sum "$fixture_dir/index.html" "$fixture_dir/public/docfx.min.js")"

      - name: Post-process DocFX HTML for accessibility
        run: bash .github/scripts/postprocess-docfx-site.sh _site

      - name: Verify DocFX accessibility patches
        run: |
          if rg -n --pcre2 '<html(?![^>]*\blang=)' _site/**/*.html _site/index.html; then
            echo "Found HTML documents without lang attribute." >&2
            exit 1
          fi

          if rg -n 'id="logo".*alt="InventarWorkerService"' _site/**/*.html _site/index.html; then
            echo "Found redundant logo alt text after post-processing." >&2
            exit 1
          fi

          if rg -n --pcre2 '<a(?=[^>]*dropdown-toggle)(?![^>]*\bhref=)[^>]*>' _site/**/*.html _site/index.html; then
            echo "Found a linkless DocFX theme anchor instead of a native button." >&2
            exit 1
          fi

          if rg -n --pcre2 '<a(?=[^>]*dropdown-toggle)(?![^>]*\bhref=)[^>]*>' _site/public/docfx.min.js; then
            echo "Found a linkless theme anchor in generated DocFX JavaScript." >&2
            exit 1
          fi

      - name: Text-browser smoke check
        run: |
          test -f _site/index.html
          lynx -dump _site/index.html | sed -n '1,80p'

      - name: Axe smoke check
        run: |
          python3 -m http.server 8080 --directory _site >/tmp/docfx-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          cat > ./docfx-axe-smoke.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:8080/');

          const themeToggle = page.getByRole('button', { name: 'Change theme', exact: true });
          if (await themeToggle.evaluate(element => element.tagName) !== 'BUTTON') {
            throw new Error('Theme toggle must be a native button.');
          }
          await themeToggle.focus();
          await themeToggle.press('Space');
          await page.waitForFunction(() => document.querySelector('button.dropdown-toggle')?.getAttribute('aria-expanded') === 'true');
          await themeToggle.press('Escape');
          await page.waitForFunction(() => document.querySelector('button.dropdown-toggle')?.getAttribute('aria-expanded') === 'false');

          const results = await new AxeBuilder({ page }).analyze();
          if (results.violations.length > 0) {
            console.error(JSON.stringify(results.violations, null, 2));
            process.exitCode = 1;
          }

          await context.close();
          await browser.close();
          EOF
          node ./docfx-axe-smoke.mjs
          rm -f ./docfx-axe-smoke.mjs

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docfx-site-preview
          path: _site

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
