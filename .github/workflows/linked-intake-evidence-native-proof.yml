name: Linked intake evidence native proof

on:
  push:
    branches: [003-linked-intake-evidence]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: linked-intake-evidence-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-proof:
    name: Native proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Configure byte-stable checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out the exact pushed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact head and native tools
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $actualHead = (& git rev-parse HEAD).Trim()
          if ($actualHead -cne '${{ github.sha }}') {
              throw "Checkout head mismatch: expected ${{ github.sha }}, observed ${actualHead}."
          }
          foreach ($command in @('git', 'bash', 'pwsh', 'jq')) {
              $resolved = Get-Command $command -ErrorAction Stop
              Write-Output "${command}=$($resolved.Source)"
          }
          if ('${{ matrix.os }}' -eq 'windows-2022' -and -not $IsWindows) {
              throw 'windows-2022 matrix entry is not running natively on Windows.'
          }
          if ('${{ matrix.os }}' -eq 'ubuntu-22.04' -and -not $IsLinux) {
              throw 'ubuntu-22.04 matrix entry is not running natively on Linux.'
          }

      - name: Run Bash contract suite
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/linked-intake-bash.log"
          bash scripts/test-requirements-intake-governance.sh 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          test "$code" -eq 0
          . scripts/render-requirements-intake-governance.sh
          source_hash=$(sdh_sha256_file scripts/test-requirements-intake-governance.sh)
          renderer_hash=$(sdh_sha256_file scripts/render-requirements-intake-governance.sh)
          log_hash=$(sdh_sha256_file "$log")
          printf 'LINKED_INTAKE_BASH_PROOF head=%s runner=%s sourceSha256=%s rendererSha256=%s logSha256=%s exitCode=%s writes=0\n' \
            '${{ github.sha }}' '${{ matrix.os }}' "$source_hash" "$renderer_hash" "$log_hash" "$code"

      - name: Run PowerShell contract suite
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'linked-intake-powershell.log'
          & pwsh -NoProfile -File scripts/test-requirements-intake-governance.ps1 2>&1 |
              Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
              throw "PowerShell contract suite failed with exit code ${code}."
          }
          $sourceHash = (Get-FileHash -LiteralPath scripts/test-requirements-intake-governance.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $rendererHash = (Get-FileHash -LiteralPath scripts/render-requirements-intake-governance.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $logHash = (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "LINKED_INTAKE_POWERSHELL_PROOF head=${{ github.sha }} runner=${{ matrix.os }} sourceSha256=${sourceHash} rendererSha256=${rendererHash} logSha256=${logHash} exitCode=${code} writes=0"

      - name: Prove zero repository writes
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
              throw 'Contract suites changed tracked repository content.'
          }
          $status = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
              throw "Contract suites left repository writes: $($status -join ', ')"
          }
          Write-Output "LINKED_INTAKE_ZERO_WRITE_PROOF head=${{ github.sha }} runner=${{ matrix.os }} writes=0"
